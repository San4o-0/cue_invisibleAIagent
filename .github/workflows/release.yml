name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Version
        id: version
        shell: pwsh
        run: |
          $version = if ("${{ github.ref_type }}" -eq "tag") { "${{ github.ref_name }}".TrimStart("v") } else { "0.0.0-dev" }
          "value=$version" >> $env:GITHUB_OUTPUT

      - name: Publish
        run: >
          dotnet publish LiveTranscriber.csproj -c Release -r win-x64 --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:EnableCompressionInSingleFile=true
          -p:DebugType=none
          -p:AssemblyName=Cue
          -p:Version=${{ steps.version.outputs.value }}
          -o dist

      - name: Upload build
        if: github.ref_type != 'tag'
        uses: actions/upload-artifact@v4
        with:
          name: Cue
          path: dist/Cue.exe

      - name: Create release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          files: dist/Cue.exe
          generate_release_notes: true
